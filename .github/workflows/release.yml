name: Release

on:
  push:
    tags:
      - "v*"
  # 🔴 THE REHEARSAL TRIGGER, AND IT PUBLISHES NOTHING. A tag run is the only
  # thing that has ever exercised this workflow, so every change to it — a new
  # action major, a GoReleaser release, a config key — is first proven during a
  # real release, which is when a failure costs the most. A manual dispatch
  # runs the same job with `release --snapshot --clean`: GoReleaser builds
  # every target and skips the publish entirely.
  #
  #     gh workflow run release.yml --ref <branch>
  #     gh run list --workflow release.yml --limit 1
  #
  # What a green dispatch proves: goreleaser-action boots on its Node runtime,
  # the GoReleaser CLI pinned by .github/actions/goreleaser accepts
  # .goreleaser.yml, and every goos/goarch in
  # it still builds. What it does NOT prove: the tag guard below (skipped, there
  # being no tag) and the upload to the GitHub release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      # Tag runs only: a dispatch has no tag to guard, and github.ref_name is
      # then a branch name, which would fail the parse and refuse a rehearsal
      # for the wrong reason.
      - name: Guard tag major.minor against MCPSurfaceVersion.RequiredDataFormat
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          surface_major=$(sed -n 's/^const MCPSurfaceVersion int = \([0-9]*\)$/\1/p' internal/surface/version.go)
          format_minor=$(sed -n 's/^const RequiredDataFormat int = \([0-9]*\)$/\1/p' internal/surface/format.go)
          tag_major=$(echo "$TAG" | sed -n 's/^v\([0-9]*\)\..*$/\1/p')
          tag_minor=$(echo "$TAG" | sed -n 's/^v[0-9]*\.\([0-9]*\)\..*$/\1/p')
          if [ -z "$surface_major" ] || [ -z "$format_minor" ] || [ -z "$tag_major" ] || [ -z "$tag_minor" ]; then
            echo "refusing release: could not parse MCPSurfaceVersion ($surface_major), RequiredDataFormat ($format_minor), or tag major.minor ($tag_major.$tag_minor) from tag $TAG" >&2
            exit 1
          fi
          if [ "$surface_major" != "$tag_major" ]; then
            echo "refusing release: tag $TAG has major $tag_major, but MCPSurfaceVersion is $surface_major — cut v${surface_major}.${format_minor}.y instead" >&2
            exit 1
          fi
          if [ "$format_minor" != "$tag_minor" ]; then
            echo "refusing release: tag $TAG has minor $tag_minor, but RequiredDataFormat is $format_minor — cut v${surface_major}.${format_minor}.y instead" >&2
            exit 1
          fi
      # The CLI version lives in the composite and nowhere else, so the binary
      # CI validates against is the binary the release runs.
      - uses: ./.github/actions/goreleaser
      # A dispatch is a rehearsal: --snapshot builds every target and publishes
      # nothing. A tag run is the real release.
      - if: github.event_name == 'workflow_dispatch'
        run: make snapshot
      - if: github.event_name == 'push'
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
