name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Guard tag major against MCPSurfaceVersion
        env:
          TAG: ${{ github.ref_name }}
        run: |
          surface_major=$(sed -n 's/^const MCPSurfaceVersion int = \([0-9]*\)$/\1/p' internal/surface/version.go)
          tag_major=$(echo "$TAG" | sed -n 's/^v\([0-9]*\)\..*$/\1/p')
          if [ -z "$surface_major" ] || [ -z "$tag_major" ]; then
            echo "refusing release: could not parse MCPSurfaceVersion ($surface_major) or tag major ($tag_major) from tag $TAG" >&2
            exit 1
          fi
          if [ "$surface_major" != "$tag_major" ]; then
            echo "refusing release: tag $TAG has major $tag_major, but MCPSurfaceVersion is $surface_major — cut v${surface_major}.x.y instead" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
