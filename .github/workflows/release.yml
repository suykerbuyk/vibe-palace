name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Guard tag major.minor against MCPSurfaceVersion.RequiredDataFormat
        env:
          TAG: ${{ github.ref_name }}
        run: |
          surface_major=$(sed -n 's/^const MCPSurfaceVersion int = \([0-9]*\)$/\1/p' internal/surface/version.go)
          format_minor=$(sed -n 's/^const RequiredDataFormat int = \([0-9]*\)$/\1/p' internal/surface/format.go)
          tag_major=$(echo "$TAG" | sed -n 's/^v\([0-9]*\)\..*$/\1/p')
          tag_minor=$(echo "$TAG" | sed -n 's/^v[0-9]*\.\([0-9]*\)\..*$/\1/p')
          if [ -z "$surface_major" ] || [ -z "$format_minor" ] || [ -z "$tag_major" ] || [ -z "$tag_minor" ]; then
            echo "refusing release: could not parse MCPSurfaceVersion ($surface_major), RequiredDataFormat ($format_minor), or tag major.minor ($tag_major.$tag_minor) from tag $TAG" >&2
            exit 1
          fi
          if [ "$surface_major" != "$tag_major" ]; then
            echo "refusing release: tag $TAG has major $tag_major, but MCPSurfaceVersion is $surface_major — cut v${surface_major}.${format_minor}.y instead" >&2
            exit 1
          fi
          if [ "$format_minor" != "$tag_minor" ]; then
            echo "refusing release: tag $TAG has minor $tag_minor, but RequiredDataFormat is $format_minor — cut v${surface_major}.${format_minor}.y instead" >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
