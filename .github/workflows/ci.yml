name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref. A new push to main (or a new PR head) cancels the
# CI still running for the ref's previous SHA instead of leaving it to burn a
# runner to completion — 32165092806 was still occupying one long after a583440
# had superseded e7b2fc9 on main and had its own full CI.
#
# github.ref is refs/heads/main for a main push and refs/pull/<n>/merge for a
# pull_request, so every PR gets its own group and no PR can cancel another, or
# main. The trade-off is accepted deliberately: a superseded main SHA loses its
# CI verdict, which is the point — that verdict is about code main has already
# moved past.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting is its own job, deliberately NOT folded into vet or test: it is
  # seconds long and toolchain-only, so it gives a fast, unambiguous verdict
  # instead of being buried behind a model download and a -race suite.
  #
  # `make fmt-check` — not a bare `gofmt -l` — because gofmt -l PRINTS drift and
  # exits 0, which reports without failing. Nothing here ran gofmt at all before
  # this job existed, which is how a583440 and 076975e landed unformatted and
  # sat at HEAD. The target's file list comes from `find`, never `git ls-files`:
  # ls-files covers only tracked files, so a new unformatted file would pass by
  # omission.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make fmt-check

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...

  # No model cache here, deliberately: no -short test loads the ONNX model.
  # The cmd/vp full-suite check tests route the Embedder row through the
  # newVaultEmbedder seam and stub it, and every real-model test skips under
  # -short. Real-model coverage is the `model` job below.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -short -race -cover ./...

  # Deliberate real-model coverage: `make model-test` runs every test that
  # constructs the real ONNX embedder (the package set is derived in the
  # Makefile, outside internal/integration), with neither -short nor -race.
  # Before this job existed the only CI exercise of the model was a side effect
  # of a cache-warming step in `test`.
  #
  # No -race because go-huggingface's downloader has a data race that only a
  # -race binary reports, and a cold cache downloads here. The cache below makes
  # a cold download rare, but it does NOT make the job offline: every NewONNX
  # makes a revision-info request to the HuggingFace API even on a warm cache,
  # so this job depends on huggingface.co being reachable on every run. The
  # cache key is shared with earlier runs of the same path; if the key or path
  # moves, it must move with where this job's hub cache resolves.
  #
  # timeout-minutes is a backstop against a wedged download (warm runtime is
  # well under a minute); the target's own `go test -timeout 10m` fires first so
  # a hang still prints its goroutine dump.
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Cache HuggingFace model downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-cache-v1-${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2
      - run: make model-test

  # 🔴 THE ONLY JOB THAT RUNS internal/sourceaudit, AND THAT IS ITS ENTIRE
  # PURPOSE. The derived-gate rule in internal/sourceaudit type-checks the whole
  # module to derive which commands and tools reach a vault-write sink, then
  # fails on any divergence from the hand-declared answer that nobody has ruled
  # on in writing. It costs ~10s, so it self-skips under -short, but that is not
  # why no other job runs it: no other job's package set includes
  # internal/sourceaudit at all — `test` above is -short over ./..., `model` runs
  # only the derived real-model packages, windows-lock runs ./internal/vaultlock
  # and a single ./internal/integration test (its second step is not even
  # -short), and make test-full / cover-full are manual targets no job invokes.
  # Delete this job and the rule runs nowhere. It needs no model cache and no
  # -race: source analysis, single-goroutine.
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: make source-audit

  # Windows-native verification of the vaultlock byte-range lock
  # (flock_windows.go). The rest of CI is Linux-only, where the windows-tagged
  # lock file is never compiled, so this is the sole runtime proof of the
  # LockFileEx/UnlockFileEx path. Two explicit commands — NOT `make test` /
  # `go test -short ./...` — because the cross-process test self-skips under
  # -short, so a mirrored -short invocation would prove only the in-process
  # lock. No -race: that needs a CGO toolchain on windows/amd64, cutting
  # against the zero-CGO ethos; TestSerialization's own overlap detector
  # proves correctness without it.
  windows-lock:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      # TestSerialization: 50-goroutine in-process overlap detector. Fast, no
      # ONNX model. Would fail today against the no-op stub.
      - run: go test -short ./internal/vaultlock/...
      # Cross-process per-handle contention proof. No -short (the test
      # self-skips under it); no model needed (vp vault edit loads no
      # embeddings), so the full ./internal/integration/... suite is avoided
      # to keep the ONNX download off the Windows runner.
      - run: go test -run TestIntegration_VaultLockCrossProcess ./internal/integration/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: CGO_ENABLED=0 go build -o vp ./cmd/vp
      - run: ./vp version

  # The five test/e2e/** bash tiers were migrated onto testinfra.RunCLI
  # (internal/testinfra/runcli.go) and now live as ordinary Go tests in
  # internal/integration/e2e_*_test.go plus the extended cli_dispatch_test.go.
  # Each job below keeps its own name, its own `go test -run` filter, and its
  # own per-tier artifact-upload step — preserving the 5-way job PARALLELISM
  # GH Actions gave the old bash jobs (a real property: folding these into one
  # sequential `go test` invocation would trade it away for no benefit) and
  # the per-tier failure granularity of the old artifact uploads.
  #
  # testinfra.RetainOnFailure names its directory "vp-e2e-<tag>.<random>" —
  # deliberately the SAME "vp-e2e-<tier>.*" dot-separator convention the old
  # `mktemp -t` runs used — so these upload globs are unchanged from the bash
  # era.
  init-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run init e2e (Go)
        run: go test -race -run '^TestIntegrationE2EInit' -v ./internal/integration/...
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: init-e2e-tmpdir
          path: /tmp/vp-e2e-init.*
          retention-days: 3
          if-no-files-found: ignore

  # Filter is `^TestIntegrationDispatch`, matching cli_dispatch_test.go's
  # existing 3 test names plus the new
  # TestIntegrationDispatchBareParentExitDiscipline (the migrated
  # dispatch/04-*.sh case), rather than renaming 3 already-passing tests to an
  # E2E-prefixed set for no behavioral reason.
  dispatch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run dispatch e2e (Go)
        run: go test -race -run '^TestIntegrationDispatch' -v ./internal/integration/...
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-e2e-tmpdir
          path: /tmp/vp-e2e-dispatch.*
          retention-days: 3
          if-no-files-found: ignore

  githook-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run git post-commit hook e2e (Go)
        run: go test -race -run '^TestIntegrationE2EGithook' -v ./internal/integration/...
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: githook-e2e-tmpdir
          path: /tmp/vp-e2e-githook.*
          retention-days: 3
          if-no-files-found: ignore

  walkthrough-e2e:
    runs-on: ubuntu-latest
    # Same reasoning as workflows-e2e below; this job carried the identical apt
    # step and therefore the identical latent hang, and merely got lucky.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run walkthrough e2e (Go)
        run: go test -race -run '^TestIntegrationE2EWalkthrough' -v ./internal/integration/...
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-e2e-tmpdir
          path: /tmp/vp-e2e-walkthrough.*
          retention-days: 3
          if-no-files-found: ignore

  workflows-e2e:
    runs-on: ubuntu-latest
    # The harness runs in ~40s (46s job wall-clock on 32166971383). 10 minutes is
    # ~15x that: generous for a slow runner, and short enough that a wedged step
    # is a red job inside ten minutes instead of occupying a runner for the
    # GitHub default of six hours. This is a backstop against ANY stuck step, not
    # a bound on the harness — the hang that prompted it (32165092806) was in the
    # apt step deleted above, and the harness never started.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run workflows e2e (Go)
        run: go test -race -run '^TestIntegrationE2EWorkflows' -v ./internal/integration/...
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-e2e-tmpdir
          path: /tmp/vp-e2e-workflows.*
          retention-days: 3
          if-no-files-found: ignore
      # FIXED, not merely ported: the retired bash harness's run.sh deleted
      # its own $TMPROOT on the success path (cleanup trap) before this
      # separate step ever ran, so this upload has been silently uploading
      # nothing on every green run since it was added (if-no-files-found:
      # ignore swallowed the failure). testinfra's workflowsMetricsDir (see
      # internal/integration/e2e_workflows_test.go) writes metrics.jsonl
      # under a plain os.MkdirTemp directory with NO cleanup registered
      # whenever CI=true (which GitHub Actions sets on every job), so the
      # directory is still here, unmodified, when this step runs.
      - name: Upload workflows metrics on success
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workflows-metrics-${{ github.sha }}
          path: /tmp/vp-e2e-workflows-metrics.*/metrics.jsonl
          retention-days: 14
          if-no-files-found: ignore
