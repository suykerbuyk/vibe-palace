name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test -short -race -cover ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: CGO_ENABLED=0 go build -o vp ./cmd/vp
      - run: ./vp version

  init-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run init e2e harness
        run: make init-e2e
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: init-e2e-tmpdir
          path: /tmp/vp-e2e-init.*
          retention-days: 3
          if-no-files-found: ignore

  dispatch-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run dispatch e2e harness
        run: make dispatch-e2e
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-e2e-tmpdir
          path: /tmp/vp-e2e-dispatch.*
          retention-days: 3
          if-no-files-found: ignore

  walkthrough-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run walkthrough e2e harness
        run: make walkthrough-e2e
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough-e2e-tmpdir
          path: /tmp/vp-e2e-walkthrough.*
          retention-days: 3
          if-no-files-found: ignore

  workflows-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run workflows e2e harness
        run: make workflows-e2e
      - name: Upload retained tmpdir on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: workflows-e2e-tmpdir
          path: /tmp/vp-e2e-workflows.*
          retention-days: 3
          if-no-files-found: ignore
      - name: Upload workflows metrics on success
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workflows-metrics-${{ github.sha }}
          path: /tmp/vp-e2e-workflows.*/cases/*/metrics.jsonl
          retention-days: 14
          if-no-files-found: ignore
