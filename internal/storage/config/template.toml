# vibe-palace configuration
# Generated by 'vp init'. Edit to customize.
#
# Three-layer precedence: embedded defaults < this file < project .vibe-palace.toml
# Only set values you want to override; defaults apply for anything omitted.

# Path to the vault directory where all palace data is stored.
vault_path = "~/vibe-palace-vault"

# Enable git version tracking for the vault.
# When true, 'vp init' initializes a git repo in the vault and
# 'vp vault pull/push/sync' commands are available.
git_enabled = true

# HTTP port for the MCP server.
http_port = 7423

# Log level: debug, info, warn, error.
log_level = "info"

# Embedding model for semantic search.
[embedder]
model = "sentence-transformers/all-MiniLM-L6-v2"
max_sequence_length = 256
batch_size = 32

# Search defaults.
[search]
default_limit = 10
structural_boost_wing = 0.12
structural_boost_hall = 0.24
structural_boost_room = 0.34

# Session transcript chunking.
[chunker]
max_chars = 800
overlap = 100

# Palace room classification and scoring.
[palace]
# Room keywords are configurable per project.
# Project-level [palace.rooms] fully replaces vault-level rooms.
# Example:
# [palace.rooms.audio]
# keywords = ["wav", "mp3", "codec", "ffmpeg"]

# Weighted scoring overrides for room classification.
# Override the minimum score threshold (default 0.6):
# [palace.scoring]
# min_score = 0.5
#
# Override or add weighted keywords for existing or new rooms:
# [palace.scoring.rooms.testing]
# high = ["integration test", "e2e test"]    # weight 1.0
# medium = ["spec"]                          # weight 0.6
# low = ["check"]                            # weight 0.3
#
# Define entirely new rooms with weighted keywords:
# [palace.scoring.rooms.ml]
# high = ["neural network", "transformer", "fine-tune"]
# medium = ["model", "training", "inference"]
# low = ["weight", "epoch"]

# LLM endpoint for offline classification tuning (vp tune rooms).
# APIKeyEnv is the name of the environment variable holding the API key,
# not the key itself.
# [palace.llm]
# endpoint = "https://api.x.ai/v1"
# model = "grok-3-mini"
# api_key_env = "XAI_API_KEY"
# max_tokens = 4096
