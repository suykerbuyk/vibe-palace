vault_path = ""
http_port = 7423
log_level = "info"

[embedder]
model = "sentence-transformers/all-MiniLM-L6-v2"
max_sequence_length = 256
batch_size = 32

[search]
default_limit = 10
structural_boost_wing = 0.12
structural_boost_hall = 0.24
structural_boost_room = 0.34

[chunker]
max_chars = 800
overlap = 100

[palace]
# Room keywords are configurable per project.
# Project-level [palace.rooms] fully replaces vault-level rooms.
# Example:
# [palace.rooms.audio]
# keywords = ["wav", "mp3", "codec", "ffmpeg"]

# Weighted scoring overrides for room classification.
# Override the minimum score threshold (default 0.6):
# [palace.scoring]
# min_score = 0.5
#
# Override or add weighted keywords for existing or new rooms:
# [palace.scoring.rooms.testing]
# high = ["integration test", "e2e test"]    # weight 1.0
# medium = ["spec"]                          # weight 0.6
# low = ["check"]                            # weight 0.3
#
# Define entirely new rooms with weighted keywords:
# [palace.scoring.rooms.ml]
# high = ["neural network", "transformer", "fine-tune"]
# medium = ["model", "training", "inference"]
# low = ["weight", "epoch"]

# LLM endpoint for offline classification tuning (vp tune rooms).
# APIKeyEnv is the name of the environment variable holding the API key,
# not the key itself.
# [palace.llm]
# endpoint = "https://api.x.ai/v1"
# model = "grok-3-mini"
# api_key_env = "XAI_API_KEY"
# max_tokens = 4096
