vault_path = ""
http_port = 7423
log_level = "info"

[embedder]
model = "all-MiniLM-L6-v2"
max_sequence_length = 256
batch_size = 32

[search]
default_limit = 10
structural_boost_wing = 0.12
structural_boost_hall = 0.24
structural_boost_room = 0.34

[chunker]
max_chars = 800
overlap = 100

[palace]
# Room keywords are configurable per project.
# Project-level [palace.rooms] fully replaces vault-level rooms.
# Example:
# [palace.rooms.audio]
# keywords = ["wav", "mp3", "codec", "ffmpeg"]
